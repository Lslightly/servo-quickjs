[package]
name = "mozjs"
# Must match the `mozjs` version Servo pins, so `[patch]` can replace it.
version = "0.26.9"
edition = "2021"
license = "MPL-2.0 AND Unicode-3.0"
description = "The mozjs (SpiderMonkey) API implemented on QuickJS, for Servo"
repository = "https://github.com/openharmony-rs/servo-quickjs"
publish = false

[lib]
# The bindgen doc comments contain C++ snippets.
doctest = false

[features]
default = ["jit", "libz-sys", "intl"]
# Accepted for compatibility with Servo's feature forwarding; no effect on QuickJS.
crown = []
debugmozjs = []
# An Intl subset over the OS's ICU: the NDK's on OpenHarmony, the system's on other Linux (libicu-dev).
intl = []
jit = []
jitspew = []
libz-rs = []
libz-sys = []
profilemozjs = []

[dependencies]
encoding_rs = "0.8.35"
libc = "0.2"
log = "0.4"
num-traits = "0.2"
servo-quickjs = { path = "../servo-quickjs" }
# Only used for the `mozjs_gc` events that servoshell's event flame graph collects; the macros
# compile to a cheap interest check when no subscriber enables the target.
tracing = { version = "0.1", default-features = false, features = ["std"] }

[build-dependencies]
cc = "1.2"
pkg-config = "0.3.34"
