[package]
name = "quickjs-sys"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Raw bindings to Bellard's QuickJS, vendored with Servo patches"
links = "quickjs"
build = "build.rs"

[features]
# Print objects still alive when a runtime is freed (QuickJS DUMP_LEAKS).
dump-leaks = []

[build-dependencies]
cc = "1.2"
